<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サークル タスクステーション</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#035485',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .ghost-card {
            opacity: 0.4;
            border: 2px dashed #3b82f6 !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid font-bold fa-list-check text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900 dark:text-white">タスクステーション</h1>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-4">
                <!-- User Selector -->
                <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700/60 p-1.5 rounded-lg border border-slate-200 dark:border-slate-600">
                    <div class="w-7 h-7 rounded-full bg-brand-500 text-white flex items-center justify-center text-xs font-bold" id="current-user-avatar">
                        ?
                    </div>
                    <select id="user-selector" onchange="changeCurrentUser(this.value)" class="bg-transparent text-sm font-medium focus:outline-none dark:text-white cursor-pointer pr-1">
                        <!-- Populated by JS -->
                    </select>
                    <button onclick="openMemberModal()" title="メンバー追加・管理" class="text-xs bg-white dark:bg-slate-600 hover:bg-slate-50 dark:hover:bg-slate-500 p-1.5 rounded-md shadow-sm border border-slate-200 dark:border-slate-500 flex items-center gap-1">
                        <i class="fa-solid fa-user-plus text-slate-600 dark:text-slate-200"></i>
                        <span class="hidden sm:inline text-xs font-semibold">管理</span>
                    </button>
                </div>

                <!-- Theme Toggle -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                    <i class="fa-solid fa-moon block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">

        <!-- Member Overview & Stats Banner -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-700 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                <div>
                    <h2 class="font-bold text-slate-900 dark:text-white text-base flex items-center gap-2">
                        <i class="fa-solid fa-users text-brand-500"></i> メンバー一覧と現在の状況
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">アイコンをタップするとその人の担当タスクのみに絞り込めます</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openAddTaskModal()" class="w-full sm:w-auto bg-brand-500 hover:bg-brand-600 text-white font-medium text-sm px-4 py-2 rounded-xl flex items-center justify-center gap-2 shadow-sm transition-all">
                        <i class="fa-solid fa-plus"></i> タスクを追加
                    </button>
                </div>
            </div>

            <!-- Member Cards Slider/Grid -->
            <div id="member-status-list" class="flex gap-3 overflow-x-auto pb-2 custom-scrollbar">
                <!-- Populated dynamically via JavaScript -->
            </div>
        </section>

        <!-- View Controls & Filter Status Bar -->
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div id="active-filter-badge" class="hidden items-center gap-2 bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 px-3 py-1.5 rounded-full text-xs font-semibold">
                <span>絞り込み中: <strong id="filter-user-name"></strong></span>
                <button onclick="clearFilter()" class="hover:text-red-500 ml-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="text-xs text-slate-500 dark:text-slate-400 ml-auto">
                <i class="fa-solid fa-circle-info mr-1"></i>カードをタップして「担当する」と着手できます
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 items-start">
            
            <!-- Column 1: TODO -->
            <div class="bg-slate-100/80 dark:bg-slate-800/60 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-700/60 flex flex-col min-h-[450px]">
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-slate-400"></span>
                        <h3 class="font-bold text-slate-700 dark:text-slate-200">未着手 (To Do)</h3>
                    </div>
                    <span id="count-todo" class="bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div id="col-todo" class="flex-1 flex flex-col gap-3 min-h-[150px]" ondragover="allowDrop(event)" ondrop="dropTask(event, 'todo')">
                    <!-- Task Cards inserted by JS -->
                </div>
            </div>

            <!-- Column 2: IN PROGRESS -->
            <div class="bg-blue-50/70 dark:bg-slate-800/80 rounded-2xl p-4 border border-blue-200/60 dark:border-blue-900/40 flex flex-col min-h-[450px]">
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-brand-500 animate-pulse"></span>
                        <h3 class="font-bold text-brand-700 dark:text-brand-300">進行中 (In Progress)</h3>
                    </div>
                    <span id="count-in_progress" class="bg-brand-100 dark:bg-brand-900/60 text-brand-700 dark:text-brand-300 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div id="col-in_progress" class="flex-1 flex flex-col gap-3 min-h-[150px]" ondragover="allowDrop(event)" ondrop="dropTask(event, 'in_progress')">
                    <!-- Task Cards inserted by JS -->
                </div>
            </div>

            <!-- Column 3: DONE -->
            <div class="bg-emerald-50/50 dark:bg-slate-800/40 rounded-2xl p-4 border border-emerald-200/50 dark:border-emerald-900/30 flex flex-col min-h-[450px]">
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <h3 class="font-bold text-emerald-800 dark:text-emerald-300">完了 (Done)</h3>
                    </div>
                    <span id="count-done" class="bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div id="col-done" class="flex-1 flex flex-col gap-3 min-h-[150px]" ondragover="allowDrop(event)" ondrop="dropTask(event, 'done')">
                    <!-- Task Cards inserted by JS -->
                </div>
            </div>

        </div>
    </main>

    <!-- Task Modal -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900 dark:text-white">新しいタスクを追加</h3>
                <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="task-form" onsubmit="handleTaskSubmit(event)" class="space-y-4">
                <input type="hidden" id="task-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">タスク名 *</label>
                    <input type="text" id="task-title" required placeholder="例: ステージ音響機器の確認" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">詳細・メモ</label>
                    <textarea id="task-desc" rows="3" placeholder="タスクの具体的な内容や注意点など" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">カテゴリ</label>
                        <select id="task-category" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                            <option value="設備">設備</option>
                            <option value="研究室・講義室">研究室・講義室</option>
                            <option value="飲食">飲食</option>
                            <option value="デザイン">デザイン</option>
                            <option value="広報">広報</option>
                            <option value="ホームページ">ホームページ</option>
                            <option value="ステージイベント">ステージイベント</option>
                            <option value="学友会企画">学友会企画</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">担当者</label>
                        <select id="task-assignee" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                            <option value="">(未定)</option>
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">ステータス</label>
                    <select id="task-status" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                        <option value="todo">未着手 (To Do)</option>
                        <option value="in_progress">進行中 (In Progress)</option>
                        <option value="done">完了 (Done)</option>
                    </select>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeTaskModal()" class="flex-1 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 rounded-xl">キャンセル</button>
                    <button type="submit" class="flex-1 py-2 text-sm font-medium text-white bg-brand-500 hover:bg-brand-600 rounded-xl shadow-sm">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Member Modal -->
    <div id="member-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">メンバー管理</h3>
                <button onclick="closeMemberModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form onsubmit="handleMemberSubmit(event)" class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">新しいメンバー名 *</label>
                    <input type="text" id="member-name" required placeholder="例: たろう" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">テーマカラー</label>
                    <div class="flex items-center gap-3" id="color-picker-group">
                        <button type="button" data-color="bg-indigo-500" class="w-8 h-8 rounded-full bg-indigo-500 ring-2 ring-offset-2 ring-indigo-500 color-opt"></button>
                        <button type="button" data-color="bg-emerald-500" class="w-8 h-8 rounded-full bg-emerald-500 color-opt"></button>
                        <button type="button" data-color="bg-rose-500" class="w-8 h-8 rounded-full bg-rose-500 color-opt"></button>
                        <button type="button" data-color="bg-amber-500" class="w-8 h-8 rounded-full bg-amber-500 color-opt"></button>
                        <button type="button" data-color="bg-purple-500" class="w-8 h-8 rounded-full bg-purple-500 color-opt"></button>
                    </div>
                </div>

                <button type="submit" class="w-full py-2 text-sm font-medium text-white bg-brand-500 hover:bg-brand-600 rounded-xl shadow-sm">+ 追加する</button>
            </form>

            <div class="border-t border-slate-200 dark:border-slate-700 pt-4">
                <h4 class="text-xs font-semibold text-slate-600 dark:text-slate-400 mb-2">登録中のメンバー</h4>
                <div id="managed-member-list" class="max-h-40 overflow-y-auto space-y-2 custom-scrollbar">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBEcQeqpKYyL1fEGbSpeVOFcPLc1IZA5N8",
            authDomain: "circle-task-app-bc2c8.firebaseapp.com",
            projectId: "circle-task-app-bc2c8",
            storageBucket: "circle-task-app-bc2c8.firebasestorage.app",
            messagingSenderId: "464072901257",
            appId: "1:464072901257:web:5ff9d504ba4957e1d67c58"
        };

        // Firebase初期化
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // State Management
        let members = [];
        let tasks = [];
        let currentUser = null;
        let selectedFilterUser = null;
        let selectedColor = 'bg-indigo-500';

        // カテゴリーごとの色設定
        const categoryColors = {
            '設備': 'bg-slate-200 text-slate-800 dark:bg-slate-700 dark:text-slate-200',
            '研究室・講義室': 'bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300',
            '飲食': 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300',
            'デザイン': 'bg-pink-100 text-pink-800 dark:bg-pink-900/40 dark:text-pink-300',
            '広報': 'bg-purple-100 text-purple-800 dark:bg-purple-900/40 dark:text-purple-300',
            'ホームページ': 'bg-cyan-100 text-cyan-800 dark:bg-cyan-900/40 dark:text-cyan-300',
            'ステージイベント': 'bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300',
            '学友会企画': 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300',
            'その他': 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-400',
        };

        window.addEventListener('DOMContentLoaded', () => {
            setupColorPicker();
            subscribeFirebaseData();
        });

        // Firebaseのリアルタイム監視
        function subscribeFirebaseData() {
            // メンバーのリアルタイム同期
            db.collection('members').onSnapshot(snapshot => {
                members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                const savedUser = localStorage.getItem('club_app_current_user');
                currentUser = members.find(m => m.id === savedUser) || members[0] || null;
                
                renderAll();
            }, error => {
                console.error("Firestore Error (members):", error);
            });

            // タスクのリアルタイム同期
            db.collection('tasks').onSnapshot(snapshot => {
                tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderAll();
            }, error => {
                console.error("Firestore Error (tasks):", error);
            });
        }

        function renderAll() {
            renderUserDropdown();
            renderMemberHeader();
            renderKanban();
            renderManagedMemberList();
        }

        function renderUserDropdown() {
            const select = document.getElementById('user-selector');
            const avatar = document.getElementById('current-user-avatar');
            
            if (members.length === 0) {
                select.innerHTML = '<option value="">メンバーなし</option>';
                avatar.className = `w-7 h-7 rounded-full bg-slate-400 text-white flex items-center justify-center text-xs font-bold`;
                avatar.innerText = '?';
                return;
            }

            select.innerHTML = members.map(m => `
                <option value="${m.id}" ${currentUser && currentUser.id === m.id ? 'selected' : ''}>
                    ${escapeHtml(m.name)} (自分)
                </option>
            `).join('');

            if (currentUser) {
                avatar.className = `w-7 h-7 rounded-full ${currentUser.color} text-white flex items-center justify-center text-xs font-bold`;
                avatar.innerText = currentUser.name.charAt(0);
            }
        }

        function renderMemberHeader() {
            const container = document.getElementById('member-status-list');
            
            if (members.length === 0) {
                container.innerHTML = `
                    <div class="text-xs text-slate-400 p-2">
                        メンバーが登録されていません。右上の「管理」ボタンからメンバーを追加してください。
                    </div>
                `;
                return;
            }

            container.innerHTML = members.map(m => {
                const activeTask = tasks.find(t => t.assigneeId === m.id && t.status === 'in_progress');
                const isSelected = selectedFilterUser === m.id;

                return `
                    <div onclick="toggleFilterUser('${m.id}')" 
                         class="cursor-pointer transition-all flex-shrink-0 flex items-center gap-3 p-2.5 pr-4 rounded-xl border ${isSelected ? 'border-brand-500 bg-brand-50/80 dark:bg-brand-950/40 ring-2 ring-brand-500/30' : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/40 hover:bg-white dark:hover:bg-slate-700'}">
                        <div class="relative">
                            <div class="w-10 h-10 rounded-full ${m.color} text-white flex items-center justify-center font-bold text-sm shadow-sm">
                                ${escapeHtml(m.name.charAt(0))}
                            </div>
                            ${activeTask ? '<span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-white dark:border-slate-800 rounded-full"></span>' : ''}
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold text-xs text-slate-800 dark:text-slate-100">${escapeHtml(m.name)}</span>
                                ${currentUser && currentUser.id === m.id ? '<span class="text-[10px] bg-slate-200 dark:bg-slate-600 px-1.5 py-0.2 rounded text-slate-600 dark:text-slate-200">自分</span>' : ''}
                            </div>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400 max-w-[120px] truncate">
                                ${activeTask ? `<span class="text-brand-600 dark:text-brand-400 font-semibold">${escapeHtml(activeTask.title)}</span>` : '待機中'}
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderKanban() {
            const cols = {
                todo: document.getElementById('col-todo'),
                in_progress: document.getElementById('col-in_progress'),
                done: document.getElementById('col-done')
            };

            const counts = { todo: 0, in_progress: 0, done: 0 };
            Object.values(cols).forEach(col => col.innerHTML = '');

            const filteredTasks = selectedFilterUser 
                ? tasks.filter(t => t.assigneeId === selectedFilterUser) 
                : tasks;

            filteredTasks.forEach(task => {
                counts[task.status]++;
                const card = createCardElement(task);
                cols[task.status].appendChild(card);
            });

            document.getElementById('count-todo').innerText = counts.todo;
            document.getElementById('count-in_progress').innerText = counts.in_progress;
            document.getElementById('count-done').innerText = counts.done;

            Object.keys(cols).forEach(status => {
                if (cols[status].children.length === 0) {
                    cols[status].innerHTML = `
                        <div class="h-32 border-2 border-dashed border-slate-200 dark:border-slate-700/60 rounded-xl flex items-center justify-center text-slate-400 text-xs">
                            タスクはありません
                        </div>
                    `;
                }
            });

            const badge = document.getElementById('active-filter-badge');
            if (selectedFilterUser) {
                const user = members.find(m => m.id === selectedFilterUser);
                document.getElementById('filter-user-name').innerText = user ? user.name : '';
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        }

        function createCardElement(task) {
            const assignee = members.find(m => m.id === task.assigneeId);
            const isAssignedToMe = currentUser && task.assigneeId === currentUser.id;

            const div = document.createElement('div');
            div.className = `bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700/80 shadow-sm hover:shadow-md transition-all cursor-grab active:cursor-grabbing group relative`;
            div.draggable = true;
            div.ondragstart = (e) => dragStart(e, task.id);

            const catClass = categoryColors[task.category] || categoryColors['その他'];

            div.innerHTML = `
                <div class="flex items-start justify-between gap-2 mb-2">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${catClass}">
                        ${escapeHtml(task.category)}
                    </span>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="openEditTaskModal('${task.id}')" class="text-slate-400 hover:text-brand-500 p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-red-500 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>

                <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100 mb-1 leading-snug">${escapeHtml(task.title)}</h4>
                ${task.desc ? `<p class="text-xs text-slate-500 dark:text-slate-400 mb-3 line-clamp-2">${escapeHtml(task.desc)}</p>` : ''}

                <div class="pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between gap-2 mt-2">
                    <div class="flex items-center gap-1.5 min-w-0">
                        ${assignee ? `
                            <div class="w-6 h-6 rounded-full ${assignee.color} text-white flex items-center justify-center text-[10px] font-bold flex-shrink-0">
                                ${escapeHtml(assignee.name.charAt(0))}
                            </div>
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-300 truncate">${escapeHtml(assignee.name)}</span>
                        ` : `
                            <span class="text-xs text-slate-400 italic">未割り当て</span>
                        `}
                    </div>

                    <div class="flex items-center gap-1">
                        ${task.status === 'todo' ? `
                            <button onclick="claimTask('${task.id}')" class="text-xs bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-300 hover:bg-brand-500 hover:text-white px-2.5 py-1 rounded-lg border border-brand-200 dark:border-brand-800 font-medium transition-colors flex items-center gap-1">
                                <i class="fa-solid fa-hand"></i> 担当する
                            </button>
                        ` : ''}

                        ${task.status === 'in_progress' ? `
                            ${isAssignedToMe ? `
                                <button onclick="completeTask('${task.id}')" class="text-xs bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-300 hover:bg-emerald-500 hover:text-white px-2.5 py-1 rounded-lg border border-emerald-200 dark:border-emerald-800 font-medium transition-colors flex items-center gap-1">
                                    <i class="fa-solid fa-check"></i> 完了
                                </button>
                            ` : `
                                <span class="text-[10px] font-medium text-brand-500 bg-brand-50 dark:bg-brand-900/30 px-2 py-0.5 rounded">着手者対応中</span>
                            `}
                        ` : ''}

                        ${task.status === 'done' ? `
                            <span class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check"></i></span>
                        ` : ''}
                    </div>
                </div>
            `;

            return div;
        }

        function changeCurrentUser(memberId) {
            currentUser = members.find(m => m.id === memberId) || null;
            if (currentUser) {
                localStorage.setItem('club_app_current_user', currentUser.id);
            }
            renderAll();
        }

        function claimTask(taskId) {
            if (!currentUser) {
                alert('最初にメンバーを登録し、右上のドロップダウンからご自身の名前を選択してください。');
                return;
            }
            db.collection('tasks').doc(taskId).update({
                assigneeId: currentUser.id,
                status: 'in_progress',
                updatedAt: Date.now()
            });
        }

        function completeTask(taskId) {
            db.collection('tasks').doc(taskId).update({
                status: 'done',
                updatedAt: Date.now()
            });
        }

        function deleteTask(taskId) {
            if (confirm('このタスクを削除しますか？')) {
                db.collection('tasks').doc(taskId).delete();
            }
        }

        function toggleFilterUser(memberId) {
            selectedFilterUser = (selectedFilterUser === memberId) ? null : memberId;
            renderAll();
        }

        function clearFilter() {
            selectedFilterUser = null;
            renderAll();
        }

        function dragStart(e, taskId) {
            e.dataTransfer.setData('text/plain', taskId);
            e.target.classList.add('ghost-card');
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropTask(e, newStatus) {
            e.preventDefault();
            const taskId = e.dataTransfer.getData('text/plain');
            const task = tasks.find(t => t.id === taskId);
            
            if (task) {
                const updateData = { status: newStatus, updatedAt: Date.now() };
                if (newStatus === 'in_progress' && !task.assigneeId && currentUser) {
                    updateData.assigneeId = currentUser.id;
                }
                db.collection('tasks').doc(taskId).update(updateData);
            }
        }

        function openAddTaskModal() {
            populateAssigneeDropdown();
            document.getElementById('modal-title').innerText = '新しいタスクを追加';
            document.getElementById('task-id').value = '';
            document.getElementById('task-title').value = '';
            document.getElementById('task-desc').value = '';
            document.getElementById('task-category').value = '設備';
            document.getElementById('task-assignee').value = currentUser ? currentUser.id : '';
            document.getElementById('task-status').value = 'todo';
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function openEditTaskModal(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            populateAssigneeDropdown();
            document.getElementById('modal-title').innerText = 'タスクを編集';
            document.getElementById('task-id').value = task.id;
            document.getElementById('task-title').value = task.title;
            document.getElementById('task-desc').value = task.desc || '';
            document.getElementById('task-category').value = task.category;
            document.getElementById('task-assignee').value = task.assigneeId || '';
            document.getElementById('task-status').value = task.status;
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function closeTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('task-title').value.trim();
            const desc = document.getElementById('task-desc').value.trim();
            const category = document.getElementById('task-category').value;
            const assigneeId = document.getElementById('task-assignee').value || null;
            const status = document.getElementById('task-status').value;

            if (!title) return;

            const taskData = {
                title,
                desc,
                category,
                assigneeId,
                status,
                updatedAt: Date.now()
            };

            if (id) {
                db.collection('tasks').doc(id).update(taskData);
            } else {
                db.collection('tasks').add(taskData);
            }

            closeTaskModal();
        }

        function populateAssigneeDropdown() {
            const select = document.getElementById('task-assignee');
            select.innerHTML = '<option value="">(未定)</option>' + members.map(m => `
                <option value="${m.id}">${escapeHtml(m.name)}</option>
            `).join('');
        }

        function openMemberModal() {
            document.getElementById('member-name').value = '';
            document.getElementById('member-modal').classList.remove('hidden');
            renderManagedMemberList();
        }

        function closeMemberModal() {
            document.getElementById('member-modal').classList.add('hidden');
        }

        function handleMemberSubmit(e) {
            e.preventDefault();
            const nameInput = document.getElementById('member-name');
            const name = nameInput.value.trim();
            if (!name) return;

            db.collection('members').add({
                name: name,
                color: selectedColor
            });

            nameInput.value = '';
        }

        function deleteMember(memberId) {
            if (confirm('このメンバーを削除しますか？')) {
                db.collection('members').doc(memberId).delete();
            }
        }

        function renderManagedMemberList() {
            const list = document.getElementById('managed-member-list');
            if (members.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-400">登録メンバーはいません。</p>';
                return;
            }

            list.innerHTML = members.map(m => `
                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 rounded-full ${m.color} text-white flex items-center justify-center text-xs font-bold">
                            ${escapeHtml(m.name.charAt(0))}
                        </div>
                        <span class="text-xs font-semibold text-slate-800 dark:text-slate-100">${escapeHtml(m.name)}</span>
                    </div>
                    <button onclick="deleteMember('${m.id}')" class="text-slate-400 hover:text-red-500 text-xs p-1">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function setupColorPicker() {
            const opts = document.querySelectorAll('.color-opt');
            opts.forEach(opt => {
                opt.addEventListener('click', (e) => {
                    opts.forEach(o => o.classList.remove('ring-2', 'ring-offset-2', 'ring-indigo-500'));
                    e.currentTarget.classList.add('ring-2', 'ring-offset-2', 'ring-indigo-500');
                    selectedColor = e.currentTarget.getAttribute('data-color');
                });
            });
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
